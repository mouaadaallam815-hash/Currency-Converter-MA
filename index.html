<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10141f">
  <meta name="description" content="Globe Currency — محول عملات بأسعار صرف محدثة">
  <title>Globe Currency</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <img src="assets/logo.png" alt="Globe Currency" class="logo" onerror="this.style.display='none'">
        <div>
          <h1>Globe Currency</h1>
          <p data-i18n="subtitle">محول العملات العالمي</p>
        </div>
      </div>
      <select id="language" aria-label="Language">
        <option value="ar">العربية</option>
        <option value="fr">Français</option>
        <option value="en">English</option>
      </select>
    </header>

    <section class="panel">
      <label for="amount" data-i18n="amountLabel">المبلغ</label>
      <input id="amount" type="number" inputmode="decimal" min="0" step="any" value="100">
      <div class="currency-row">
        <span class="currency-symbol" id="fromSymbol">$</span>
        <div class="currency-fields">
          <label class="sr-only" for="fromCurrency" data-i18n="fromLabel">من العملة</label>
          <select id="fromCurrency"></select>
          <span class="currency-name" id="fromName"></span>
        </div>
      </div>
    </section>

    <div class="swap-wrap">
      <button id="swap" class="swap-button" type="button" aria-label="Swap currencies">↕</button>
    </div>

    <section class="panel result-panel">
      <label for="toCurrency" data-i18n="toLabel">العملة المستهدفة</label>
      <output id="result" class="result">—</output>
      <div class="currency-row">
        <span class="currency-symbol" id="toSymbol">€</span>
        <div class="currency-fields">
          <label class="sr-only" for="toCurrency" data-i18n="toLabel">إلى العملة</label>
          <select id="toCurrency"></select>
          <span class="currency-name" id="toName"></span>
        </div>
      </div>
    </section>

    <section class="rate-card">
      <div class="rate-line"><span data-i18n="exchangeRate">سعر الصرف</span><strong id="rate">—</strong></div>
      <div class="rate-line"><span data-i18n="updated">آخر تحديث</span><span id="updatedAt">—</span></div>
      <p id="status" role="status" data-i18n="loading">جارٍ تحميل أسعار الصرف…</p>
      <button id="refresh" class="refresh-button" type="button" data-i18n="refresh">تحديث الأسعار</button>
    </section>

    <footer><span>Globe Currency</span><span data-i18n="footer">الأسعار تعتمد على مصدر خارجي وقد تتأخر.</span></footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
